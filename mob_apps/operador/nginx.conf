server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad HTTP
    add_header X-Frame-Options        "SAMEORIGIN"                          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy     "geolocation=(), camera=(self), microphone=()" always;
    add_header X-Content-Type-Options "nosniff"                             always;

    # API y archivos de storage → contenedor app (Laravel)
    location ~ ^/(api|storage)/ {
        proxy_pass            http://app:80;
        proxy_set_header      Host app.estetican.org;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
    }

    # index.html nunca se cachea (Cloudflare o browser) para que siempre cargue el JS correcto
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri /index.html;
    }

    # SPA — cualquier ruta que no sea archivo estático → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
